<div class="my-5" style="width: 100%;padding-bottom: 12px;">
    <div class="is-size-6">{{post.date | date: "%b %d, '%y" }}
      {% if post.tags %}
      <div class="control ml-2 is-inline-block">
        <div class="tags">
          {% for tag in post.tags %}
          <span class="tag">#{{tag}}</span>
          {% endfor %}
        </div>
      </div>
     {% endif %}
       {% if post.wip %}
        <div class="control ml-2 is-inline-block">
          <div class="tags has-addons">
            <span class="tag is-dark">status</span>
            <span class="tag is-info">work-in-progress</span>
          </div>
        </div>
       {% endif %}
    </div>
    <div class="is-size-4 my-2" style="line-height: 1.3;">
        <a class='' href={{post.url}}>{{ post.title }}</a>
    </div>
    <p class="is-size-6">
        {{ post.description }}
    </p>
</div>
