<div class="my-3 columns" style="width: 100%;padding-bottom: 12px;">
    {% if post.embed %}
    <div class="column">
        {{post.embed}}
    </div>
    {% endif %}
    <div class="column">
        <p class="is-size-6 ">{{post.date | date: "%b %d, '%y" }} | {{ post.where }}</p>
        <div class="is-size-3">
            <a class='' target="_blank" href={{post.external_url}}>{{ post.title }}</a>
        </div>
        <p style="font-size: 14px;" class="">
            {{ post.description }}
            &nbsp;&nbsp;
            {% if post.slides %}
            <a class='' underline' href={{post.slides}} target="_blank">[Slides]</a>
            {% endif %}
            {% if post.demo %}
            <a class='' underline' href={{post.demo}} target="_blank">[Demo]</a>
            {% endif %}
        </p>
    </div>
</div>
